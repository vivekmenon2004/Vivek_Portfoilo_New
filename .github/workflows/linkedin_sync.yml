name: Automated LinkedIn Posts Sync

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub UI

permissions:
  contents: write

jobs:
  sync-linkedin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync LinkedIn Posts & Images
        env:
          LINKEDIN_FEED_URL: ${{ secrets.LINKEDIN_FEED_URL }}
        run: |
          node scripts/sync_linkedin.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/linkedin_posts.json assets/images/linkedin/
          if git diff --staged --quiet; then
            echo "No new LinkedIn posts or updates detected."
          else
            git commit -m "Automated LinkedIn posts synchronization [skip ci]"
            git push origin main
            echo "Successfully committed and pushed updated LinkedIn feed data!"
          fi
